# Deploys the app to a free Hugging Face Space (Docker) on every push to main.
# Setup (once): see docs/DEPLOYMENT.md
#   - GitHub repo secret   HF_TOKEN  = a Hugging Face access token with "write" permission
#   - GitHub repo variable HF_SPACE  = <hf-username>/<space-name>, e.g. ecomobility/eco-dp
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push a snapshot to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::Skipping deploy: set the HF_TOKEN secret and HF_SPACE variable (see docs/DEPLOYMENT.md)"; exit 0
          fi
          [ -f public/brand/eco-logo.png ] || echo "::warning::public/brand/eco-logo.png is missing – the app will show 'Setup pending'"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hf-deploy
          # Hugging Face Spaces read their settings from YAML front matter in README.md
          {
            printf -- '---\ntitle: ECO Professional DP\nemoji: 📸\ncolorFrom: red\ncolorTo: gray\nsdk: docker\napp_port: 3000\npinned: false\n---\n\n'
            cat README.md
          } > README.hf && mv README.hf README.md
          # Hugging Face only accepts binary files (e.g. the logo) through Git LFS
          git lfs install
          git lfs track "*.png" "*.jpg" "*.jpeg"
          rm -rf .github   # CI files are not needed in the Space
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          OWNER="${HF_SPACE%%/*}"
          git push --force "https://${OWNER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-deploy:main
